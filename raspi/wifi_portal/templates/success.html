<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>WiFi Connected - Filmkorn Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            text-align: center;
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo img {
            max-width: 200px;
            height: auto;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(74, 222, 128, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #4ade80;
        }
        
        .message {
            font-size: 1.1rem;
            color: #a0a0a0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .ssid {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            color: #fff;
            margin-top: 10px;
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-top: 20px;
        }
        
        .instructions h2 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #e94560;
        }
        
        .instructions ol {
            padding-left: 20px;
            color: #a0a0a0;
            line-height: 1.8;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/logo.png" alt="Filmkorn Scanner">
        </div>
        
        <div class="success-icon">&#10003;</div>
        
        <h1>WiFi Connected!</h1>
        
        <p class="message">
            Your Filmkorn Scanner is now connected to:
            <span class="ssid">{{ ssid or 'WiFi Network' }}</span>
        </p>
        
        <div class="instructions">
            <h2>Next Steps</h2>
            <ol>
                <li>Disconnect from "Filmkorn Scanner Setup" WiFi on your device</li>
                <li>The scanner will automatically use the new WiFi connection</li>
                <li>Return to your scanner to continue setup</li>
            </ol>
        </div>
    </div>
    
    <script>
        // Attempt to shut down the portal after showing success
        setTimeout(() => {
            fetch('/shutdown', { method: 'POST' }).catch(() => {});
        }, 5000);
    </script>
</body>
</html>
